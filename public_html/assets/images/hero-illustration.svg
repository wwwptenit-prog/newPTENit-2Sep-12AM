<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>
  <!-- Background Glow & Grid -->
  <rect x="20" y="20" width="460" height="360" rx="24" fill="url(#heroBg)" />
  <circle cx="380" cy="100" r="90" fill="#16A34A" opacity="0.15" filter="blur(30px)" />
  <circle cx="100" cy="300" r="80" fill="#22C55E" opacity="0.1" filter="blur(25px)" />
  
  <!-- Browser Frame Mockup -->
  <rect x="50" y="60" width="400" height="260" rx="16" fill="#0B1120" stroke="#334155" stroke-width="2" />
  <circle cx="75" cy="80" r="5" fill="#EF4444" />
  <circle cx="90" cy="80" r="5" fill="#F59E0B" />
  <circle cx="105" cy="80" r="5" fill="#10B981" />
  <rect x="130" y="72" width="220" height="16" rx="8" fill="#1E293B" />
  
  <!-- Dashboard UI Inside -->
  <rect x="70" y="105" width="110" height="70" rx="10" fill="#1E293B" />
  <rect x="80" y="118" width="40" height="8" rx="4" fill="#16A34A" />
  <rect x="80" y="132" width="80" height="16" rx="4" fill="#334155" />
  <rect x="80" y="154" width="60" height="6" rx="3" fill="#64748B" />
  
  <rect x="195" y="105" width="110" height="70" rx="10" fill="#1E293B" />
  <rect x="205" y="118" width="40" height="8" rx="4" fill="#22C55E" />
  <rect x="205" y="132" width="80" height="16" rx="4" fill="#334155" />
  <rect x="205" y="154" width="60" height="6" rx="3" fill="#64748B" />
  
  <rect x="320" y="105" width="110" height="70" rx="10" fill="#16A34A" fill-opacity="0.2" stroke="#16A34A" stroke-width="1.5" />
  <text x="335" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#22C55E">PTENit Cloud</text>
  <text x="335" y="155" font-family="sans-serif" font-size="10" fill="#94A3B8">Active &amp; Scaled</text>
  
  <!-- Chart & Metrics Area -->
  <rect x="70" y="190" width="240" height="110" rx="10" fill="#1E293B" />
  <path d="M85 270 C 120 250, 150 260, 180 230 C 210 200, 240 220, 285 205" fill="none" stroke="url(#greenGlow)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Floating Success Badge -->
  <g transform="translate(320, 200)">
    <rect width="130" height="90" rx="14" fill="#0F172A" stroke="#16A34A" stroke-width="2" />
    <circle cx="35" cy="35" r="16" fill="#16A34A" />
    <path d="M29 35L33 39L41 31" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">100% Ready</text>
    <text x="60" y="47" font-family="sans-serif" font-size="9" fill="#22C55E">cPanel &amp; Cloud</text>
    <rect x="15" y="62" width="100" height="14" rx="4" fill="#1E293B" />
    <text x="25" y="73" font-family="sans-serif" font-size="8" fill="#94A3B8">Firebase Connected</text>
  </g>
</svg>
