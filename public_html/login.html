<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PTENit Client &amp; Admin Portal</title>
  <meta name="description" content="Sign in to your PTENit account to manage your services, hosting accounts, and invoices.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="nav-brand">
        <img src="assets/logo/logo.svg" alt="PTENit Logo">
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="products.html" class="nav-link">Products</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
      <div class="nav-actions">
        <button type="button" class="icon-btn theme-toggle-btn" title="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="cart.html" class="icon-btn" title="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- AUTH CARD -->
  <section class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/logo/logo.svg" alt="PTENit Logo">
        <h2>Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem;">
          Sign in to your client dashboard or admin panel
        </p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 1.1rem;">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" required class="form-control" placeholder="name@company.com" value="admin@ptenit.com">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="loginPassword">Password</label>
            <a href="#" onclick="handleForgotPassword()" style="font-size: 0.8rem; color: var(--accent); font-weight: 700;">Forgot Password?</a>
          </div>
          <div style="position: relative;">
            <input type="password" id="loginPassword" required class="form-control" placeholder="Enter password" value="admin123">
            <button type="button" onclick="togglePasswordVisibility('loginPassword')" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); font-size: 0.9rem; color: var(--text-muted); cursor: pointer;">
              👁️
            </button>
          </div>
        </div>

        <!-- Quick Demo Note -->
        <div style="background: var(--bg-alt); padding: 0.75rem 1rem; border-radius: var(--radius); border: 1px solid var(--border); font-size: 0.8rem; line-height: 1.4;">
          🔑 <strong>Admin Credentials:</strong> <code>admin@ptenit.com</code> / <code>admin123</code>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-lg" style="margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account yet? <a href="signup.html" style="color: var(--accent); font-weight: 800;">Create Account</a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer" style="padding: 2rem 0;">
    <div class="container footer-bottom" style="border: none; padding: 0;">
      <p>&copy; 2026 PTENit. 100% cPanel Ready.</p>
    </div>
  </footer>

  <script src="firebase.js"></script>
  <script src="script.js"></script>
  <script>
    function togglePasswordVisibility(id) {
      const input = document.getElementById(id);
      if (input) {
        input.type = input.type === "password" ? "text" : "password";
      }
    }

    function handleForgotPassword() {
      const email = document.getElementById("loginEmail").value;
      if (!email) {
        showToast("Please enter your email address first", "info");
        return;
      }
      showToast(`Password reset link has been dispatched to ${email}`, "success");
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPassword").value;
      const btn = document.getElementById("loginSubmitBtn");

      btn.disabled = true;
      btn.textContent = "Verifying...";

      try {
        const res = await window.PTENitFirebase.loginUser(email, pass);
        if (res.success) {
          showToast("Welcome back! Signing you in...", "success");
          setTimeout(() => {
            if (res.user && res.user.isAdmin) {
              window.location.href = "admin.html";
            } else {
              window.location.href = "index.html";
            }
          }, 800);
        } else {
          showToast(res.message || "Invalid credentials. Try again.", "error");
          btn.disabled = false;
          btn.textContent = "Sign In";
        }
      } catch (err) {
        showToast("Login error: " + err.message, "error");
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    }
  </script>
</body>
</html>
