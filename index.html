<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#091124" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PTENit" />
    <link rel="manifest" href="./manifest.json" />
    <title>PTENit</title>
    <meta name="description" content="PTENit & Marketplace - Professional IT Services, Skills Training & Freelance Projects Platform" />
    <meta property="og:title" content="PTENit" />
    <meta property="og:description" content="PTENit & Marketplace - Professional IT Services, Skills Training & Freelance Projects Platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #070D1B;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .preloader-spin {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(56, 189, 248, 0.15);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin-kf 0.85s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin-kf {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-[#1DB954] selection:text-white">
    <!-- Clean Splash Preloader (fades out as soon as React starts) -->
    <div id="app-preloader">
      <div class="preloader-spin"></div>
      <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; color: #ffffff;">
        PTEN<span style="color: #38bdf8;">it</span>
      </div>
      <div style="font-size: 13px; color: #94a3b8; max-width: 320px; line-height: 1.5;">
        ওয়েবসাইট লোড হচ্ছে, অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন...
      </div>
    </div>

    <div id="root"></div>
    <script>
      // Safety: auto-fade preloader after 2.5s maximum even on slow devices
      setTimeout(function() {
        var el = document.getElementById('app-preloader');
        if (el) {
          el.style.transition = 'opacity 0.3s ease';
          el.style.opacity = '0';
          setTimeout(function() { if (el && el.parentNode) el.parentNode.removeChild(el); }, 320);
        }
      }, 2500);

      window.addEventListener('error', function(e) {
        var el = document.getElementById('app-preloader');
        if (el && (!e.filename || e.filename.indexOf('index') !== -1 || e.message.indexOf('module') !== -1)) {
          el.innerHTML = '<div style="max-width: 420px; background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 24px; text-align: center;">' +
            '<div style="font-size: 28px; margin-bottom: 12px;">⚠️</div>' +
            '<div style="font-size: 16px; font-weight: bold; color: #ffffff; margin-bottom: 8px;">ফাইল লোড হতে সমস্যা হয়েছে</div>' +
            '<div style="font-size: 12px; color: #94a3b8; line-height: 1.5; margin-bottom: 16px;">ব্রাউজার স্ক্রিপ্ট ফাইলটি খুঁজে পাচ্ছে না। অনুগ্রহ করে নিশ্চিত করুন যে cPanel-এ <b>assets</b> ফোল্ডার ও <b>index.html</b> ফাইল সঠিকভাবে আপলোড ও এক্সট্র্যাক্ট করা হয়েছে।</div>' +
            '<button onclick="location.reload()" style="background: #38bdf8; color: #020617; font-weight: bold; padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-size: 12px;">রিলোড দিন</button>' +
          '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
